<!DOCTYPE html>
<html>
<head>
    <title>Dream Places</title>

    <style>
        body {
            background: #dff6ff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
        }

        .gallery {
            background: #ffffff;
            max-width: 700px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 100, 150, 0.2);
        }

        h1 {
            text-align: center;
            color: #006d77;
            margin-bottom: 25px;
        }

        .photos {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .photos img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #83c5be;
        }

        .photos img:hover {
            border-color: #006d77;
            opacity: 0.8;
        }

        p {
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

<div class="gallery">

    <h1>MY DREAM PLACES</h1>

    <p>Beautiful places I would love to visit.</p>

    <div class="photos">

        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
             alt="Beach">

        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
             alt="Mountain">

        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
             alt="Forest">

        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
             alt="Lake">

        <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e"
             alt="Nature">

        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
             alt="Landscape">

        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
             alt="Valley">

        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
             alt="Mountains">

    </div>

</div>

</body>
</html>
