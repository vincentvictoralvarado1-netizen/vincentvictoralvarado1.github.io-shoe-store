<!DOCTYPE html>
<html>
<head>
    <title>Exercise 5 - HTML Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 30px;
        }

        .poem {
            background-color: white;
            max-width: 800px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        .images {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 30px;
        }

        .images img {
            width: 50px;
            height: 50px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="poem">
        <h1>Dreams and Hope</h1>

        <p>
            I wake each day and see the light,<br>
            I take one step and start my flight.<br>
            Though roads may sometimes feel unknown,<br>
            I keep on going on my own.
        </p>

        <div class="images">
            <img src="https://wallpapers.com/images/featured/beach-sunset-pictures-43h9lzv2hp9lycm6.jpg" alt="Sunrise">
            <img src="https://tse1.mm.bing.net/th/id/OIP.gwUjoYO8aGuy0zLAeMoJpwHaFb?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Mountain">
            <img src="https://tse4.mm.bing.net/th/id/OIP.K4VFwuBa0OAP6rxjDzwpdAHaEo?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Road">
        </div>

        <p>
            My dreams may seem so far away,<br>
            But I will work for them each day.<br>
            With hope and courage in my heart,<br>
            I know each step can be a start.
        </p>

        <div class="images">
            <img src="https://wallpapers.com/images/featured/beach-sunset-pictures-43h9lzv2hp9lycm6.jpg" alt="Sunrise">
            <img src="https://tse1.mm.bing.net/th/id/OIP.gwUjoYO8aGuy0zLAeMoJpwHaFb?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Mountain">
            <img src="https://tse4.mm.bing.net/th/id/OIP.K4VFwuBa0OAP6rxjDzwpdAHaEo?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Road">
        </div>
    </div>

</body>
</html>
