<!DOCTYPE html>
<html>
<head>
    <title>Simple List</title>
</head>
<body>

<h3>Lowercase Letters:</h3>
<ol type="a">
    <li>Apple</li>
    <li>Banana</li>
    <li>Mango</li>
</ol>

<h3>Roman Numbers:</h3>
<ol type="I">
    <li>Red</li>
    <li>Blue</li>
    <li>Green</li>
</ol>

<h3>Lowercase Roman Numbers:</h3>
<ol type="i">
    <li>Cat</li>
    <li>Dog</li>
    <li>Fish</li>
</ol>

</body>
</html>
